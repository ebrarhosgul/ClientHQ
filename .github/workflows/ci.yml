# The gate every push and pull request goes through.
#
# Two jobs. The first runs what the pre-commit hook runs locally plus the unit
# tests and the migration drift check: format, lint, typecheck, tests,
# migrations. The second applies every migration from empty to a throwaway
# PostgreSQL container and asserts the resulting schema matches spec 0002.
# Neither needs a provider credential, which is deliberate: a check that needs
# a secret cannot run on a fork's pull request. The container's password below
# is not a secret, it lives for the length of the job.
#
# Preview deploys are not here. Vercel handles those on its own.
name: CI

on:
  push:
  pull_request:

# A new push to the same branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, migrations
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Before setup-node, so its pnpm cache lookup finds pnpm. The version
      # comes from the "packageManager" field in package.json.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every check below runs even when an earlier one fails, so one push
      # reports every problem instead of one problem at a time.
      - name: Formatting
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test

      # Are the committed migrations still in step with src/db/schema/?
      - name: Migration check
        if: ${{ !cancelled() }}
        run: pnpm db:migrate:check

  # Does the migration actually apply, and does it produce the schema spec 0002
  # describes? The drift check above cannot answer that: it compares files. This
  # job runs the SQL against a real PostgreSQL, twice (the second run must apply
  # nothing and exit zero), then reads the catalogue and compares every table,
  # constraint, index and foreign key ON DELETE action with the spec.
  #
  # postgres:17 matches the Supabase project (`select version()` says 17.6).
  # Bump it when the project moves.
  migrations-apply:
    name: Apply migrations to a fresh PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clienthq
          POSTGRES_PASSWORD: clienthq
          POSTGRES_DB: clienthq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clienthq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DIRECT_URL: postgresql://clienthq:clienthq@localhost:5432/clienthq

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply every migration from empty
        run: pnpm db:migrate

      - name: Apply again, expecting nothing to happen
        run: pnpm db:migrate

      - name: Assert the schema matches spec 0002
        run: pnpm db:schema:assert
