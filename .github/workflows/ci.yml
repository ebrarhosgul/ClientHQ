# The gate every push and pull request goes through.
#
# Three jobs. The first runs what the pre-commit hook runs locally plus the unit
# tests and the migration drift check: format, lint, typecheck, tests,
# migrations. The second applies every migration from empty to a throwaway
# PostgreSQL container and asserts the resulting schema matches spec 0002. The
# third runs the browser suite, which is where axe sees the application as it is
# actually painted (spec 0004, AC-19).
# Neither needs a provider credential, which is deliberate: a check that needs
# a secret cannot run on a fork's pull request. The container's password below
# is not a secret, it lives for the length of the job.
#
# Preview deploys are not here. Vercel handles those on its own.
name: CI

on:
  push:
  pull_request:

# A new push to the same branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, migrations
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Before setup-node, so its pnpm cache lookup finds pnpm. The version
      # comes from the "packageManager" field in package.json.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every check below runs even when an earlier one fails, so one push
      # reports every problem instead of one problem at a time.
      - name: Formatting
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test

      # Are the committed migrations still in step with src/db/schema/?
      - name: Migration check
        if: ${{ !cancelled() }}
        run: pnpm db:migrate:check

  # Does the migration actually apply, and does it produce the schema spec 0002
  # describes? The drift check above cannot answer that: it compares files. This
  # job runs the SQL against a real PostgreSQL, twice (the second run must apply
  # nothing and exit zero), then reads the catalogue and compares every table,
  # constraint, index and foreign key ON DELETE action with the spec.
  #
  # postgres:17 matches the Supabase project (`select version()` says 17.6).
  # Bump it when the project moves.
  migrations-apply:
    name: Apply migrations to a fresh PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clienthq
          POSTGRES_PASSWORD: clienthq
          POSTGRES_DB: clienthq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clienthq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # `env()` in src/lib/env.ts parses every required key at once, not only the
    # ones a given test touches: src/invoices/notify.ts calls `env()` for two
    # fields, but that fails the whole parse when anything else required is
    # missing. Most of these are placeholders, not credentials, same as the
    # postgres password above, because the Stripe gateway and Clerk session
    # are stubbed in every suite here. CLERK_WEBHOOK_SIGNING_SECRET is the
    # exception: src/auth/webhook.db.test.ts signs every delivery for real
    # through this value (spec 0015 deliberately does not fake signature
    # verification), so it must be valid base64 after the `whsec_` prefix or
    # every case in that file fails verification, not just parse `env()`.
    env:
      DIRECT_URL: postgresql://clienthq:clienthq@localhost:5432/clienthq
      DATABASE_URL: postgresql://clienthq:clienthq@localhost:5432/clienthq
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /onboarding
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /onboarding
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRICE_ID: price_ci_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_Y2ktcGxhY2Vob2xkZXItc2VjcmV0LXZhbHVl
      EMAIL_FROM: ci@example.com
      CRON_SECRET: ci-placeholder-cron-secret-value

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply every migration from empty
        run: pnpm db:migrate

      - name: Apply again, expecting nothing to happen
        run: pnpm db:migrate

      - name: Assert the schema matches spec 0002
        run: pnpm db:schema:assert

      # The claim spec 0003 exists to make good: one agency cannot reach
      # another's rows. This suite seeds two organizations into the container
      # above and asks every accessor method for something it must not be able
      # to see. Every cross tenant assertion failing fails the job. It runs here
      # rather than in the unit job because it needs real SQL, and it is skipped
      # without DIRECT_URL so `pnpm test` still runs without a database.
      - name: Prove tenant scoping holds
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/db/tenant/tenancy.db.test.ts

      # The money helpers and the CHECK constraints must round the same way.
      # This test is skipped without a database, so it runs here, not above.
      - name: Check the TypeScript rounding agrees with PostgreSQL
        run: pnpm vitest run src/lib/money.db.test.ts

      # Replay, ordering, the row lock and the rollback are all claims about
      # PostgreSQL rather than about TypeScript, so the Stripe webhook is proven
      # here against real SQL. Stripe itself is faked; the transaction is not.
      - name: Prove the Stripe webhook survives replay, reordering and rollback
        run: pnpm vitest run src/payments/webhook.db.test.ts

      # Same claims as the Stripe webhook above, proven for Clerk: signature
      # verification, the eight event filter, replay, out of order delivery,
      # both refusals, the cascades and the concurrency claim (spec 0015).
      - name: Prove the Clerk webhook survives replay, reordering and rollback
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/auth/webhook.db.test.ts

      # The tenant context resolver and the org/user/membership upserts the
      # Clerk webhook writes through, proven against real SQL rather than
      # TypeScript's idea of what the query does.
      - name: Prove tenant context resolution and provisioning hold
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/db/tenant/context.db.test.ts src/db/tenant/provisioning.db.test.ts

      # Two simultaneous issues of one draft get consecutive numbers and only
      # one succeeds; a line removal racing an issue is refused; agency B
      # cannot see agency A's invoices, lines or events. All three are claims
      # about the row lock and the transaction, not about TypeScript.
      - name: Prove invoice numbering, concurrency and tenant isolation hold
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/invoices/invoices.db.test.ts

      # A throw inside tenantTransaction must roll every write back, including
      # the invoice counter, and nextInvoiceNumber must never hand out another
      # agency's number.
      - name: Prove tenantTransaction rolls back and the invoice counter stays scoped
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/db/tenant/transaction.db.test.ts

      # The invoice_events CHECKs (a status kind carries both statuses, a
      # notification kind carries neither) only mean something enforced by
      # real PostgreSQL.
      - name: Prove the invoice_events CHECKs refuse a malformed row
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/db/invoice-events.db.test.ts

      # The cron run row, per sweep isolation and the report shape (spec 0017)
      # are claims about a real transaction and a real row, not about
      # TypeScript's idea of the runner.
      - name: Prove the cron runner writes and updates the run row
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/cron/runner.db.test.ts

      # The overdue sweep's compare and set, its one transaction with the
      # event, and its idempotence on a second run (spec 0017, AC-4, AC-12).
      - name: Prove the overdue invoice sweep moves the right invoices once
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/invoices/overdue-sweep.db.test.ts

      # Object before row, the failed row left in place, and the 200 row cap
      # with the fake object store (spec 0017, AC-5).
      - name: Prove the abandoned upload sweep removes object then row
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/deliverables/abandoned-sweep.db.test.ts

      # The 30 day cutoff, in one statement, against a real row (spec 0017,
      # AC-6).
      - name: Prove the expired invite sweep clears only what is past the cutoff
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/contacts/expired-invites-sweep.db.test.ts

      # The complete listing rule, the newest per agency rule, and the shared
      # applySubscriptionState lock and customer id guard, against real SQL
      # with Stripe faked (spec 0017, AC-7).
      - name: Prove the Stripe reconcile resolves, picks the newest, and applies once
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/payments/reconcile.db.test.ts

      # The three pass order (organizations, memberships, users), the soft
      # delete and scrub rules, and per object error isolation, against real
      # SQL with Clerk faked (spec 0017, AC-8).
      - name: Prove the Clerk reconcile soft deletes, scrubs, and isolates errors
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/auth/reconcile.db.test.ts

      # The 90 day cutoff on both tables, in one run, leaving the current
      # run's own fresh row alone (spec 0017, AC-9).
      - name: Prove the retention prune removes only what is past 90 days
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/cron/retention-sweep.db.test.ts

      # Two runner calls at once against the real overdue and abandoned
      # upload sweeps: no lock is taken, and idempotence by construction is
      # what keeps both runs safe (spec 0017, AC-12).
      - name: Prove two overlapping runs never duplicate a write
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/cron/overlap.db.test.ts

      # A run that soft deletes an organization and scrubs a user reads real
      # personal data to do it; this greps its report and every log line for
      # none of it leaking back out (spec 0017, AC-10).
      - name: Prove a run's report and logs carry no personal data
        if: ${{ !cancelled() }}
        run: pnpm vitest run src/cron/privacy.db.test.ts

  # The browser half of the accessibility proof. The two jobs above run no
  # browser, so without this the Playwright side of spec 0004's AC-19 would
  # never run on a push and the suite would rot unnoticed.
  #
  # It needs no provider credential for the signed out suite: `/` renders
  # without a database and without a Clerk session, and the shell degrades to
  # its signed out state. The client portal's own signed in suite (spec 0014,
  # `e2e/portal-contact.spec.ts`) is the one exception: `playwright.config.ts`
  # only defines that project when the five secrets below are all set, so a
  # fork or a run with none of them configured behaves exactly as before.
  #
  # Those five secrets alone are not enough to turn that suite green here: it
  # also needs a real, seeded database, which this job does not provision
  # (unlike `migrations-apply` above). Wiring that up is a follow up, tracked
  # in spec 0014.
  browser:
    name: Browser suite and axe
    runs-on: ubuntu-latest

    env:
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      E2E_CLERK_CONTACT_USERNAME: ${{ secrets.E2E_CLERK_CONTACT_USERNAME }}
      E2E_CLERK_CONTACT_PASSWORD: ${{ secrets.E2E_CLERK_CONTACT_PASSWORD }}
      E2E_CLERK_CONTACT_USER_ID: ${{ secrets.E2E_CLERK_CONTACT_USER_ID }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only. The suite checks semantics, contrast and layout, none of
      # which differ enough between engines to pay for three browsers on every
      # push.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End to end tests
        run: pnpm test:e2e

      - name: Keep the report from a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
